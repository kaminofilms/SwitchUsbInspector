name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug + release APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SwitchUsbInspector-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/SwitchUsbInspector.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/SwitchUsbInspector-debug.apk

      - name: Publish as "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Switch USB Inspector (latest build)
          body: Built from ${{ github.sha }}. Install SwitchUsbInspector.apk.
          prerelease: false
          make_latest: true
          files: dist/*.apk

      - name: Save APKs to apk-builds branch
        run: |
          cd dist
          git init -q -b apk-builds
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "APK from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" apk-builds
